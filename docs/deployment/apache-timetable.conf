# Apache deployment example for Timetable Query System

# Required Apache modules:
#   a2enmod proxy proxy_http rewrite headers
#
# Build frontend:
#   cd client
#   npm install
#   npm run build
#
# Copy client/dist contents to /var/www/timetable-query
# Run backend Node/Express internally on 127.0.0.1:3000 with server/.env.

<VirtualHost *:80>
    ServerName timetable.school.example

    DocumentRoot /var/www/timetable-query
    DirectoryIndex index.html

    <Directory /var/www/timetable-query>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # Optional: keep old Google callback path working if GOOGLE_CALLBACK_URL uses /auth/google/callback.
    ProxyPass /auth http://127.0.0.1:3000/auth
    ProxyPassReverse /auth http://127.0.0.1:3000/auth

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/timetable-query-error.log
    CustomLog ${APACHE_LOG_DIR}/timetable-query-access.log combined
</VirtualHost>
